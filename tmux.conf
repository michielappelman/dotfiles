# REBIND PREFIX
unbind C-b

# SESSION SETTINGS
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g status-keys vi
setw -g mode-keys vi
set -s escape-time 0
setw -g aggressive-resize off
# This enables standard scrollback selection
set -g terminal-overrides 'xterm*:smcup@:rmcup@'
set -ga terminal-overrides ",*-256color:Tc"

# OTHER REBINDS
bind b command-prompt
bind | split-window -h
bind - split-window -v
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."
bind [ previous-window
bind ] next-window
bind j join-pane -t:!

# MOUSE
setw -g mouse on

setw -g monitor-activity on
set -g visual-activity on

# STATUS BAR
set -g status-left-length 32
set -g status-right-length 150
set -g status-fg white
set -g status-bg colour234

set -g status-left '#[fg=colour235,bg=colour252,bold] #S #[fg=colour238,bg=colour234,nobold]'
set -g status-right '#(hostname -s) '
set -g window-status-format "#[fg=white,bg=colour234] #I:#W "
set -g window-status-current-format "#[fg=colour234,bg=colour39]#[fg=colour254,bg=colour39,noreverse,bold] #I:#W #[fg=colour39,bg=colour234,nobold]"
